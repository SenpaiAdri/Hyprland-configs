general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; brightnessctl -r 2>/dev/null || true
}

# 1770s: dim screen 10%
listener {
    timeout = 1770
    on-timeout = brightnessctl -s set 10% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 1800s: lock
listener {
    timeout = 1800
    on-timeout = loginctl lock-session 2>/dev/null || hyprlock 2>/dev/null || true
}

# 1830s: dpms off
listener {
    timeout = 1830
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; brightnessctl -r 2>/dev/null || true
}

# 2100s: suspend
listener {
    timeout = 2100
    on-timeout = systemctl suspend
}
