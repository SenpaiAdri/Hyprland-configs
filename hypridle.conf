general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on; brightnessctl -r 2>/dev/null || true
}

# 150s: dim screen 10%
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 300s: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session 2>/dev/null || hyprlock 2>/dev/null || true
}

# 330s: dpms off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on; brightnessctl -r 2>/dev/null || true
}

# 600s: suspend
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
