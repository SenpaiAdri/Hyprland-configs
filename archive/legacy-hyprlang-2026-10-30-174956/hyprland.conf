# Hyprland — modular config
# Each module lives in ~/.config/hypr/conf/. Edit those, not this file.
# Order matters: programs ($vars) before autostart/keybinds that use them,
# theme (colors.conf) provides col.active/inactive_border for appearance.

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/programs.conf
source = ~/.config/hypr/conf/environment.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/appearance.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/layout.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/window-rules.conf
