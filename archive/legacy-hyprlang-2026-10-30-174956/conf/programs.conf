# Let Hyprland tile terminals instead of restoring Kitty's cached maximized state.
$terminal = kitty -o remember_window_size=no
$fileManager = nautilus
$menu = quickshell ipc call launcher toggle
$wallpaperScript = ~/.config/hypr/scripts/wallpaper.sh
$powermenu = quickshell ipc call powermenu toggle
$mainMod = SUPER
