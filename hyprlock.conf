# Hyprlock — Cozy Minimal Dark (Ultra minimal)
# Inter UI + screenshot blur, rounding 16, dynamic colors via hyprlock-colors.conf

source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor = 
    path = screenshot
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.17
    color = rgba(17, 17, 27, 0.55)
}

# Time — large, centered top
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 0.95)
    font_size = 56
    font_family = Inter Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(186, 194, 222, 0.85)
    font_size = 16
    font_family = Inter
    position = 0, 130
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.7)
    font_size = 13
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(137, 180, 250, 0.30)
    inner_color = rgba(30, 30, 46, 0.75)
    font_color = rgba(205, 214, 244, 0.95)
    fade_on_empty = false
    placeholder_text = <i>  Password  </i>
    hide_input = false
    rounding = 16
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(249, 226, 175, 0.9)
    numlock_color = rgba(137, 180, 250, 0.9)
    bothlock_color = rgba(243, 139, 168, 0.9)
    invert_numlock = false
    swap_font_color = false
    position = 0, -30
    halign = center
    valign = center
}

# Caps lock indicator
label {
    monitor =
    text = cmd[update:1000] echo "Caps Lock" | grep -q "$(hyprlock --help 2>/dev/null || true)" && hyprctl getoption input:kb_options 2>/dev/null | grep -q caps || true
    color = rgba(249, 226, 175, 0.0)
    font_size = 11
    font_family = Inter
    position = 0, -90
    halign = center
    valign = center
}
