### WINDOWS AND WORKSPACES ###
##############################
# Window rules — new Hyprland 0.56 syntax uses 'windowrule' (check `hyprctl configerrors`)
# For now keep minimal rules, add more via hyprctl keyword once wiki verified
# Example (uncomment after verifying syntax):
# windowrule = float, class:^(pavucontrol|blueman-manager)$
# windowrule = size 800 600, class:^(pavucontrol)$
# windowrule = center, class:^(pavucontrol|blueman-manager)$
# windowrule = opacity 0.96 0.92, class:^(kitty)$

# --- Wallpaper picker — GTK only (1024x600 cover, strict) ---
windowrule = match:class wallpaper-picker, float on, size 1024 600, center on, rounding 16, opacity 0.97 override 0.97 override, dim_around on
windowrule = match:title Wallpaper Picker, float on, size 1024 600, center on, rounding 16, opacity 0.97 override 0.97 override, dim_around on
windowrule = match:class pavucontrol|blueman-manager|nm-connection-editor, float on, size 860 520, center on

