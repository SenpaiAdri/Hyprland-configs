#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 0
    border_size = 1
    # Dynamic borders — sourced from colors.conf (theme-generator)
    # Fallback static if colors.conf missing:
    # col.active_border = rgba(7b2cbfee) rgba(140152ee) 45deg
    # col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.80

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.28
        new_optimizations = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
