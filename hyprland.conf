################
### MONITORS ###
################
monitor=eDP-1,preferred,auto,1
monitor=HDMI-A-1,1920x1080,1920x0,1

# Generated dynamic colors (matugen) - fallback to Catppuccin Mocha if not present
source = /home/eydriannn/.config/hypr/colors.conf

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$wallpaperScript = ~/.config/hypr/scripts/wallpaper.sh
$powermenu = wlogout

#################
### AUTOSTART ###
#################
exec-once = waybar
exec-once = systemctl --user start swaync 2>/dev/null || swaync
exec-once = [workspace 1 silent] brave
exec-once = [workspace 2 silent] cursor
exec-once = [workspace 3 silent] kitty
# Wallpaper daemon - awww (successor to swww) with fallback to hyprpaper
exec-once = awww-daemon 2>/dev/null || hyprpaper
exec-once = hypridle 2>/dev/null || true
exec-once = hyprsunset --temperature 4000 2>/dev/null || true
exec-once = wl-paste --type text --watch cliphist store 2>/dev/null || true
exec-once = wl-paste --type image --watch cliphist store 2>/dev/null || true

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_THEME,Bibata-Modern-Ice
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = GDK_SCALE,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(7b2cbfee) rgba(140152ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.80
    
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.28
        new_optimizations = true
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOut, 0.25, 1, 0.5, 1
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
        middle_button_emulation = true
    }
}

# swipe gesture — disabled for now (syntax varies per Hyprland 0.56)
# gestures { workspace_swipe = true }

##############
### BINDS ###
##############
$mainMod = SUPER

# --- Apps ---
bind = alt, Q, exec, $terminal
bind = alt, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, # float window
bind = alt, R, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, J, pseudo,
bind = alt, Y, exec, $terminal -e yazi
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# --- Focus (vim) ---
bind = alt, h, movefocus, l
bind = alt, l, movefocus, r
bind = alt, k, movefocus, u
bind = alt, j, movefocus, d

# --- Workspaces ---
bind = alt, 1, workspace, 1
bind = alt, 2, workspace, 2
bind = alt, 3, workspace, 3
bind = alt, 4, workspace, 4
bind = alt, 5, workspace, 5
# alt+6-0 reserved for future

bind = $mainMod, Tab, workspace, previous
bind = alt, tab, workspace, previous

# move workspace to target workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Special workspace (scratchpad) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Media keys ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Screenshot & Lock ---
bind = , PRINT, exec, hyprshot -m region
bind = $mainMod, PRINT, exec, hyprshot -m window
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, L, exec, hyprlock

# --- Custom polished binds ---
bind = alt, F4, exec, ~/.config/waybar/scripts/power-menu.sh
bind = $mainMod, P, exec, wlogout 2>/dev/null || ~/.config/waybar/scripts/power-menu.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/toggle-sunset.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh --random

# --- Power key ---
bind = , XF86PowerOff, exec, hyprlock & sleep 0.5 && systemctl suspend

